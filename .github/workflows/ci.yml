name: engine

on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v5
      - if: runner.os == 'macOS'
        run: brew install libomp
      - run: uv sync --frozen --extra ml --extra parquet
      - run: uv run --frozen --extra ml --extra parquet python -m pytest
      - run: uv run --frozen python -m compileall -q src

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --extra ml --extra parquet
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: uv run --no-sync npm run test:e2e --prefix frontend
        env:
          T1FX_PYTHON: python
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: dashboard-browser-results
          path: frontend/test-results/
