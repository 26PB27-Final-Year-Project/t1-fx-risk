name: engine

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[parquet,ml]' pytest httpx
      - run: python -m pytest
      - run: python -m compileall -q src
      - run: python -m t1fx.cli --artifacts /tmp/t1fx-ci demo
      - run: python -m t1fx.cli --artifacts /tmp/t1fx-ci generate --config configs/generation/smoke.json --format both

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -e .
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e --prefix frontend
        env:
          T1FX_PYTHON: python
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: dashboard-browser-results
          path: frontend/test-results/
