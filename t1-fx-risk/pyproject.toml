[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "t1-fx-risk"
version = "0.1.0"
description = "Reproducible T+1 settlement simulation and FX funding research engine"
requires-python = ">=3.11,<3.15"
dependencies = [
  "pydantic>=2.9,<3",
  "numpy>=2.1,<3",
  "scipy>=1.14,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
parquet = ["pyarrow>=18,<24"]
ml = ["scikit-learn>=1.6,<2", "xgboost>=3,<4"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[project.scripts]
t1fx = "t1fx.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/t1fx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

